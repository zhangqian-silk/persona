name: Apple CI
on:
  workflow_call:
    inputs:
      lane:
        description: Apple platform lane
        type: string
        default: ios
        required: false
  workflow_dispatch:
    inputs:
      lane:
        description: Apple platform lane
        type: choice
        options: [ios]
        default: ios
        required: true
permissions:
  contents: read
concurrency:
  # A file-specific prefix cannot collide with the CI caller's group.
  group: apple-${{ github.repository }}-${{ github.ref_name }}-${{ inputs.lane || 'ios' }}
  cancel-in-progress: true
jobs:
  apple:
    name: iOS, Watch and HTML tests (Xcode 26.0)
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      CI_SPM_CACHE: ${{ github.workspace }}/.ci-cache/spm
      APPLE_CI_LANE: ${{ inputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize pinned Xcode
        run: |
          source scripts/ci/common.sh
          # Background platform services use the system selection, not just this shell's environment.
          ci_run 'Select system Xcode 26.0' 60 sudo xcode-select --switch "$DEVELOPER_DIR"
          ci_run 'Initialize Xcode 26.0 platform services' 900 sudo env DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -runFirstLaunch
          ci_run 'Verify system Xcode selection' 60 xcode-select --print-path
      - name: Install project generation tools
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: .ci-cache/spm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.0-${{ hashFiles('apple/**/Package.resolved', 'apple/**/Package.swift', 'apple/project.yml', 'scripts/test/isolation-lint/Package.resolved', 'scripts/test/isolation-lint/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.0-
      - name: Apple checks
        env:
          CI_APPLE_DIAGNOSTICS: ${{ runner.temp }}/persona-apple-diagnostics-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/ci/apple.sh "$APPLE_CI_LANE"
      - name: Upload Apple failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ inputs.lane }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/persona-apple-diagnostics-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
