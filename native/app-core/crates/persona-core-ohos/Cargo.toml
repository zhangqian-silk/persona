[package]
name = "persona-core-ohos"
description = "The shared Rust core's HarmonyOS NAPI binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "persona_core_ohos"
crate-type = ["cdylib", "rlib"]

[features]
default = []
ohos = ["dep:napi-build-ohos", "dep:napi-derive-ohos", "dep:napi-ohos"]

[dependencies]
persona-core-runtime.workspace = true
persona-core.workspace = true
serde_json.workspace = true
napi-ohos = { version = "=1.2.0", default-features = false, features = ["napi4"], optional = true }
napi-derive-ohos = { version = "=1.2.0", optional = true }

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]
napi-build-ohos = { version = "=1.2.0", optional = true }

[lints]
workspace = true
